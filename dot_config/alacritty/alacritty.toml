[general]
live_config_reload = true
working_directory = "None"

[window]
padding.x = 10
padding.y = 10
startup_mode = "Maximized"

[font]
size = 13.0

[font.normal]
family = "IosevkaTerm NF"
style = "Regular"

# Gruvbox Material (Gogh) Color Scheme
[colors.primary]
background = "#1d2021"
foreground = "#ebdbb2"

[colors.normal]
black   = "#282828"
red     = "#ea6962"
green   = "#a9b665"
yellow  = "#d8a657"
blue    = "#7daea3"
magenta = "#d3869b"
cyan    = "#89b482"
white   = "#dfdbcf"

[colors.bright]
black   = "#928374"
red     = "#ea6962"
green   = "#a9b665"
yellow  = "#d8a657"
blue    = "#7daea3"
magenta = "#d3869b"
cyan    = "#89b482"
white   = "#dfdbcf"
